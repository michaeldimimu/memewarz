services:
  # 1. Express Backend Web Service
  - type: web
    runtime: node
    name: express-backend
    buildCommand: pnpm run build --filter=memewarz-server...
    startCommand: pnpm run start --filter=memewarz-server
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: "your_database_connection_string_here" # Or use valueFrom if referencing a Render DB
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: nextjs-frontend
          property: connectionString

  # 2. Next.js Frontend Web Service
  - type: web
    runtime: node
    name: nextjs-frontend
    buildCommand: pnpm run build --filter=client...
    startCommand: pnpm run start --filter=client
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: express-backend
          property: connectionString
